# ASRIN — GitHub Pages yayını (statik önizleme)
# Her "main" push'unda: bağımlılıklar kurulur, testler çalışır, site derlenir, çıktı denetlenir ve GitHub Pages'e yüklenir.
# Bir kez yapılacak ayar: Depo → Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Pages adresini (origin) ve alt yolu (base_path, ör. /depo-adi) otomatik verir
      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      - run: npm test

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          DEPLOY_ENV: staging
          ALLOW_INDEXING: 'false'

      - name: Statik çıktı denetimi
        run: npm run check:static
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
